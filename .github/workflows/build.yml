name: Build and Compile Check

on:
  pull_request:
    branches: [ master, main, develop ]
  push:
    branches: [ master, main, develop ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    strategy:
      matrix:
        config: [Debug, Release]
        platform: [x64]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Restore NuGet packages
      run: nuget restore HEW_GAME.sln
    
    - name: Build solution
      run: msbuild HEW_GAME.sln /p:Configuration=${{ matrix.config }} /p:Platform=${{ matrix.platform }} /m

    - name: Check for build errors
      if: failure()
      run: |
        echo "Build failed for config=${{ matrix.config }}, platform=${{ matrix.platform }}"
        exit 1

    # ====== Release/master only: 成果物収集 ======

    - name: Collect build outputs (Release/master only)
      if: github.ref == 'refs/heads/master' && matrix.config == 'Release'
      shell: cmd
      run: |
        mkdir artifact

        REM exe と Release の中身
        xcopy /E /I /Y ".\x64\Release\*" artifact\

        REM Assets フォルダも丸ごと入れる
        xcopy /E /I /Y ".\Assets\*" artifact\Assets\

    - name: Upload artifact (optional)
      if: github.ref == 'refs/heads/master' && matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: HEW_GAME-${{ matrix.platform }}-${{ matrix.config }}
        path: artifact/**
        compression-level: 9

    - name: Archive build for release
      if: github.ref == 'refs/heads/master' && matrix.config == 'Release'
      run: |
        powershell Compress-Archive -Path artifact\* -DestinationPath HEW_GAME.zip -Force

    # ====== 公開用 Repo (aptma-sHEWTeam/hew-game-release) に Release ======

    - name: Install GitHub CLI
      if: github.ref == 'refs/heads/master' && matrix.config == 'Release'
      shell: powershell
      run: |
        choco install gh -y
        gh --version

    - name: Create release on public repo and upload asset
      if: github.ref == 'refs/heads/master' && matrix.config == 'Release'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_PAT }}
      run: |
        TARGET_REPO="aptma-sHEWTeam/hew-game-release"
        TAG="v0.1.${{ github.run_number }}"
        TITLE="Auto build ${{ github.run_number }}"

        # 既存の同タグリリースがあれば消す（エラー無視）
        gh release delete "$TAG" --repo "$TARGET_REPO" --yes 2>/dev/null || true

        # Release 作成＋zip アップロード
        gh release create "$TAG" "HEW_GAME.zip" \
          --repo "$TARGET_REPO" \
          --title "$TITLE" \
          --notes "Automated build from private repo run #${{ github.run_number }}" \
          --prerelease

  compile-check:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Compile check (Debug/x64)
      run: msbuild HEW_GAME.sln /p:Configuration=Debug /p:Platform=x64 /m /v:quiet
      continue-on-error: false
