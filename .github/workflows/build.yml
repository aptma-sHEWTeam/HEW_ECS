name: Build and Compile Check

on:
  pull_request:
    branches: [ master, main, develop ]
    paths-ignore: # paths-ignore を追加
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
  push:
    branches: [ master, main, develop ]
    paths-ignore: # paths-ignore を追加
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'

jobs:
  # === PR用: Debugビルドのみ (動作確認・高速化) ===
  check-pr:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30 # タイムアウト設定を追加
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore NuGet packages
      run: nuget restore HEW_GAME.sln
    
    - name: Build solution (Debug)
      run: msbuild HEW_GAME.sln /p:Configuration=Debug /p:Platform=x64 /m

  # === Master Push用: Releaseビルド & 公開 (本番用) ===
  build-release:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30 # タイムアウト設定を追加
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore NuGet packages
      run: nuget restore HEW_GAME.sln
    
    - name: Build solution (Release)
      run: msbuild HEW_GAME.sln /p:Configuration=Release /p:Platform=x64 /m

    - name: Collect build outputs
      shell: cmd
      run: |
        mkdir artifact
        xcopy /E /I /Y ".\x64\Release\*" artifact\
        del /S /Q artifact\*.pdb
        del /S /Q artifact\*.lib
        del /S /Q artifact\*.exp
        del /S /Q artifact\*.iobj
        del /S /Q artifact\*.ipdb

    - name: Archive build
      run: |
        powershell Compress-Archive -Path artifact\* -DestinationPath HEW_GAME.zip -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: HEW_GAME-x64-Release
        path: artifact/**
        compression-level: 0

    - name: Create release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_PAT }}
      run: |
        TARGET_REPO="aptma-sHEWTeam/hew-game-release"
        TAG="v0.1.${{ github.run_number }}"
        TITLE="Auto build ${{ github.run_number }}"

        gh release delete "$TAG" --repo "$TARGET_REPO" --yes 2>/dev/null || true

        gh release create "$TAG" "HEW_GAME.zip" \
          --repo "$TARGET_REPO" \
          --title "$TITLE" \
          --notes "Automated build from private repo run #${{ github.run_number }}" \
          --prerelease

